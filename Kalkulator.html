<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Energi AI (Terawatt)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-top: 0;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #cbd5e1;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 6px;
            background-color: #334155;
            color: #ffffff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .formatted-hint {
            font-size: 0.8rem;
            color: #38bdf8;
            margin-top: 4px;
            min-height: 1.2em;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0369a1;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #0f172a;
            border-radius: 8px;
            border-left: 5px solid #38bdf8;
            display: none;
        }
        .result-title {
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        .result-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffffff;
        }
        .result-note {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ Kalkulator Energi AI</h2>
    <p class="subtitle">Hitung estimasi konsumsi energi kluster GPU skala besar</p>
    
    <div class="form-group">
        <label for="cluster-size-raw">Jumlah GPU / Akselerator:</label>
        <input type="text" id="cluster-size-raw" placeholder="Contoh: 100.000 atau 1,5jt" value="100.000">
        <div class="formatted-hint" id="cluster-hint">Terbaca: 100.000 GPU</div>
    </div>
    
    <div class="form-group">
        <label for="power-per-gpu-raw">Daya per GPU + Pendingin (Watt):</label>
        <input type="text" id="power-per-gpu-raw" placeholder="Contoh: 1.000 atau 1k" value="1.000">
        <div class="formatted-hint" id="power-hint">Terbaca: 1.000 Watt</div>
    </div>
    
    <div class="form-group">
        <label for="duration-raw">Durasi Operasi:</label>
        <input type="text" id="duration-raw" placeholder="Contoh: 8.760" value="8.760">
        <div class="formatted-hint" id="duration-hint">Terbaca: 8.760</div>
    </div>
    
    <div class="form-group">
        <label for="time-unit">Satuan Waktu:</label>
        <select id="time-unit">
            <option value="hours" selected>Jam (Hours)</option>
            <option value="days">Hari (Days)</option>
            <option value="years">Tahun (Years)</option>
        </select>
    </div>
    
    <button onclick="calculateEnergy()">Hitung Energi (TW/TWh)</button>
    
    <div class="result-box" id="result-box">
        <div class="result-title">Hasil Estimasi Konsumsi Energi:</div>
        <div class="result-value" id="energy-instantaneous">0 TW (Daya Sesaat)</div>
        <div class="result-value" id="energy-total" style="margin-top: 10px;">0 TWh (Total Energi)</div>
        <div class="result-note">* 1 Terawatt (TW) = 1.000.000.000.000 Watt (10¹² W).</div>
    </div>
</div>

<script>
    function parseHumanNumber(text) {
        if (!text) return NaN;
        let str = text.trim().toLowerCase();
        
        let multiplier = 1;
        if (str.endsWith('jt') || str.endsWith('juta')) {
            multiplier = 1000000;
            str = str.replace(/juta|jt/g, '');
        } else if (str.endsWith('rb') || str.endsWith('ribu') || str.endsWith('k')) {
            multiplier = 1000;
            str = str.replace(/ribu|rb|k/g, '');
        } else if (str.endsWith('m') || str.endsWith('milyar') || str.endsWith('miliar')) {
            multiplier = 1000000000;
            str = str.replace(/milyar|miliar|m/g, '');
        }

        const dotCount = (str.match(/\./g) || []).length;
        const commaCount = (str.match(/,/g) || []).length;
        
        if (dotCount > 0 && commaCount === 0) {
            if (/\.\d{3}(\D|$)/.test(str) || dotCount > 1) {
                str = str.replace(/\./g, '');
            }
        } else if (commaCount > 0) {
            str = str.replace(/\./g, '');
            str = str.replace(/,/g, '.');
        }
        
        return parseFloat(str) * multiplier;
    }

    function formatIndonesian(num) {
        if (isNaN(num) || num === null) return '';
        return new Intl.NumberFormat('id-ID').format(num);
    }

    function setupLiveHint(inputId, hintId, suffix) {
        const inputEl = document.getElementById(inputId);
        const hintEl = document.getElementById(hintId);
        
        function updateHint() {
            const val = parseHumanNumber(inputEl.value);
            if (isNaN(val)) {
                hintEl.innerText = 'Format tidak valid';
                hintEl.style.color = '#ef4444';
            } else {
                hintEl.innerText = 'Terbaca: ' + formatIndonesian(val) + ' ' + suffix;
                hintEl.style.color = '#38bdf8';
            }
        }
        inputEl.addEventListener('input', updateHint);
        updateHint();
    }

    window.addEventListener('DOMContentLoaded', () => {
        setupLiveHint('cluster-size-raw', 'cluster-hint', 'GPU');
        setupLiveHint('power-per-gpu-raw', 'power-hint', 'Watt');
        setupLiveHint('duration-raw', 'duration-hint', '');
    });

    function calculateEnergy() {
        const clusterSize = parseHumanNumber(document.getElementById('cluster-size-raw').value);
        const powerPerGpu = parseHumanNumber(document.getElementById('power-per-gpu-raw').value);
        let duration = parseHumanNumber(document.getElementById('duration-raw').value);
        const timeUnit = document.getElementById('time-unit').value;
        
        if (isNaN(clusterSize) || isNaN(powerPerGpu) || isNaN(duration)) {
            alert('Mohon periksa kembali inputan Anda. Pastikan format angka sudah benar.');
            return;
        }
        
        if (timeUnit === 'days') duration *= 24;
        else if (timeUnit === 'years') duration *= 8760;
        
        const totalPowerWatt = clusterSize * powerPerGpu;
        const totalPowerTW = totalPowerWatt / 1e12;
        const totalEnergyTWh = (totalPowerWatt * duration) / 1e12;
        
        document.getElementById('energy-instantaneous').innerText = totalPowerTW < 0.000001 ? 
            totalPowerTW.toExponential(4) + ' TW' : totalPowerTW.toLocaleString('id-ID', {maximumFractionDigits: 7}) + ' TW';
            
        document.getElementById('energy-total').innerText = totalEnergyTWh < 0.000001 ? 
            totalEnergyTWh.toExponential(4) + ' TWh' : totalEnergyTWh.toLocaleString('id-ID', {maximumFractionDigits: 7}) + ' TWh';
        
        document.getElementById('result-box').style.display = 'block';
    }
</script>
</body>
</html>
